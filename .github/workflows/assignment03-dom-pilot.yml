name: Assignment 03 offline DOM data pilot

on:
  pull_request:
    paths:
      - 'src/phishing_url/dom_dataset.py'
      - 'tests/test_dom_dataset.py'
      - 'config/assignment03_dom_pilot.json'
      - 'config/assignment03_paired_release_policy_v1.json'
      - 'src/phishing_url/paired_quality.py'
      - 'tests/test_paired_quality.py'
      - 'requirements-dom.txt'
      - 'docker/Dockerfile.dom-data'
      - '.github/workflows/assignment03-dom-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-data-pilot:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'codex/assignment03-dom-data-preparation')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify software and unchanged frozen URL implementation
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
      - name: Prepare isolated job paths and provenance
        run: |
          mkdir -p "$RUNNER_TEMP/dom-pilot/input" "$RUNNER_TEMP/dom-pilot/output" "$RUNNER_TEMP/dom-pilot/meta"
          git rev-parse HEAD > "$RUNNER_TEMP/dom-pilot/meta/project_commit.txt"
          cp config/assignment03_dom_pilot.json "$RUNNER_TEMP/dom-pilot/meta/source_protocol.json"
      - name: Acquire only the preregistered public dataset shard
        run: |
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          import requests
          cfg = json.loads(Path('config/assignment03_dom_pilot.json').read_text())
          assert cfg['download_url'].startswith('https://huggingface.co/datasets/phreshphish/phreshphish/resolve/' + cfg['revision'] + '/')
          base = Path(os.environ['RUNNER_TEMP']) / 'dom-pilot'
          destination = base / 'input/source.parquet'
          h = hashlib.sha256()
          count = 0
          with requests.get(cfg['download_url'], stream=True, timeout=(15, 60)) as response:
              response.raise_for_status()
              with destination.open('xb') as stream:
                  for block in response.iter_content(1 << 20):
                      count += len(block)
                      if count > cfg['max_download_bytes']:
                          raise ValueError('download exceeds fixed pilot bound')
                      h.update(block)
                      stream.write(block)
          evidence = {'retrieved_at_utc': datetime.now(timezone.utc).isoformat(),
                      'source_revision': cfg['revision'], 'source_file': cfg['source_file'],
                      'expected_sha256': cfg['source_file_sha256'], 'actual_sha256': h.hexdigest(),
                      'bytes': count, 'match': h.hexdigest() == cfg['source_file_sha256'],
                      'live_webpage_requests': 0}
          (base / 'meta/source_integrity.json').write_text(json.dumps(evidence, indent=2) + '\n')
          if not evidence['match']:
              raise ValueError('source checksum mismatch; do not substitute another file')
          PY
      - name: Build passive data preparation image
        run: |
          docker build -f docker/Dockerfile.dom-data -t assignment03-dom-data .
          docker image inspect assignment03-dom-data --format '{{.Id}}' > "$RUNNER_TEMP/dom-pilot/meta/container_image_id.txt"
      - name: Parse and audit without network access
        run: |
          docker run --rm --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --pids-limit=128 --memory=2g --cpus=2 \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m \
            -v "$RUNNER_TEMP/dom-pilot/input:/input:ro" \
            -v "$RUNNER_TEMP/dom-pilot/output:/output:rw" \
            -v "$GITHUB_WORKSPACE/config/assignment03_dom_pilot.json:/config.json:ro" \
            assignment03-dom-data --parquet /input/source.parquet --config /config.json --output /output/pilot
      - name: Run formal-quality preflight on pilot evidence
        run: |
          docker run --rm --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --pids-limit=128 --memory=2g --cpus=2 \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m \
            -v "$RUNNER_TEMP/dom-pilot/output:/output:rw" \
            -v "$GITHUB_WORKSPACE/config/assignment03_paired_release_policy_v1.json:/release-policy.json:ro" \
            --entrypoint python assignment03-dom-data \
            -m phishing_url.paired_quality \
            --manifest /output/pilot/paired_manifest.jsonl \
            --html-root /output/pilot \
            --policy /release-policy.json \
            --output /output/quality
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'dom-pilot/output/quality/quality_report.json').read_text())
          assert report['training_approved'] is False
          assert report['model_training_performed'] is False
          assert report['test_evaluated'] is False
          assert report['formal_data_ready_for_research_review'] is False
          print(json.dumps({
              'technical_gate_pass': report['technical_gate_pass'],
              'formal_partition_present': report['formal_partition_present'],
              'bias_review_required': report['bias_review_required'],
              'formal_data_ready_for_research_review': report['formal_data_ready_for_research_review'],
              'training_approved': report['training_approved'],
          }, indent=2))
          PY
      - name: Surface aggregate pilot result without raw URLs or HTML
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'dom-pilot/output/pilot/public/pilot_summary.json').read_text())
          print(json.dumps({k: result[k] for k in ('status', 'candidate_count', 'usable_pairs', 'status_counts', 'per_label', 'pilot_split_counts', 'training_approved', 'test_evaluated')}, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('## DOM data feasibility pilot\n')
              output.write('Candidates: ' + str(result['candidate_count']) + '; usable URL/HTML pairs: ' + str(result['usable_pairs']) + '.\n\n')
              output.write('Technical result: `' + result['status'] + '`. No model training, no final dataset approval, and no test evaluation.\n')
          PY
      - name: Preserve aggregate evidence and deterministic replay index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assignment03-dom-data-pilot-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/dom-pilot/meta/
            ${{ runner.temp }}/dom-pilot/output/pilot/public/
            ${{ runner.temp }}/dom-pilot/output/quality/
