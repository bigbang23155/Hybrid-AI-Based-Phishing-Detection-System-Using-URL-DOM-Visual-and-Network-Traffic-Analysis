name: Assignment 03 feature and modeling contract
on:
  pull_request:
    paths:
      - 'src/phishing_url/dom_features.py'
      - 'src/phishing_url/modality_contract.py'
      - 'tests/test_dom_features.py'
      - 'tests/test_modality_contract.py'
      - 'tests/test_feature_protocol_lock.py'
      - 'config/assignment03_modeling_protocol_v1.json'
      - 'config/assignment03_feature_protocol_lock_v1.json'
      - '.github/workflows/assignment03-feature-protocol.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned software
        run: python -m pip install -r requirements-dom.txt
      - name: Full offline suite, synthetic DOM fixtures only
        run: python -m pytest -q
      - name: Verify definitions without formal HTML access or fitting
        run: |
          python -m phishing_url.modality_contract --output "$RUNNER_TEMP/contract/feature_protocol_verification.json"
          git rev-parse HEAD > "$RUNNER_TEMP/contract/project_commit.txt"
          python -m pip freeze > "$RUNNER_TEMP/contract/python_packages.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: assignment03-feature-protocol-${{ github.run_id }}
          path: ${{ runner.temp }}/contract/
          retention-days: 90
