name: Assignment 03 paired development models
on:
  pull_request:
    paths:
      - 'src/phishing_url/paired_development.py'
      - 'tests/test_paired_development.py'
      - 'config/assignment03_development_execution_v1.json'
      - 'scripts/verify_paired_development.py'
      - '.github/workflows/assignment03-paired-development.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  development:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'codex/assignment03-paired-development')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned software and run full suite
        run: |
          python -m pip install -r requirements-dom.txt
          python -m pytest -q
      - name: Verify definition and membership locks
        run: |
          mkdir -p "$RUNNER_TEMP/development/meta" "$RUNNER_TEMP/development/output"
          python -m phishing_url.modality_contract --output "$RUNNER_TEMP/development/meta/contract.json"
          git rev-parse HEAD > "$RUNNER_TEMP/development/meta/project_commit.txt"
          python -m pip freeze > "$RUNNER_TEMP/development/meta/python_packages.txt"
          lscpu > "$RUNNER_TEMP/development/meta/cpu.txt"
          cp config/assignment03_modeling_protocol_v1.json config/assignment03_development_execution_v1.json "$RUNNER_TEMP/development/meta/"
      - name: Acquire only six fixed source shards
        run: |
          python -m phishing_url.formal_candidates --download --source-root "$RUNNER_TEMP/development/input" --frame config/assignment03_paired_source_frame_v1.json --policy config/assignment03_paired_release_policy_v1.json
      - name: Build passive offline execution image
        run: |
          docker build -f docker/Dockerfile.dom-data -t assignment03-development .
          docker image inspect assignment03-development --format '{{.Id}}' > "$RUNNER_TEMP/development/meta/image_id.txt"
      - name: Extract development only, gate, then run fixed 70 fits
        run: |
          docker run --rm --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --pids-limit=128 --memory=5g --cpus=2 \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m \
            -v "$RUNNER_TEMP/development/input:/input:ro" \
            -v "$RUNNER_TEMP/development/output:/output:rw" \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            --entrypoint python assignment03-development -m phishing_url.paired_development \
            --root /repo --source-root /input --output /output/run
      - name: Independently verify validation metrics and paired intervals
        run: |
          python scripts/verify_paired_development.py --repository . \
            --public "$RUNNER_TEMP/development/output/run/public" \
            --output "$RUNNER_TEMP/development/output/run/public/independent_verification.json"
      - name: Preserve sanitized execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assignment03-paired-development-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/development/meta/
            ${{ runner.temp }}/development/input/acquisition.json
            ${{ runner.temp }}/development/output/run/public/
