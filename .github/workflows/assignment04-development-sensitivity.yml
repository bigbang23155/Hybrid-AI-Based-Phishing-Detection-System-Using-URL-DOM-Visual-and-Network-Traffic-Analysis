name: A04 development sensitivity and demo
on:
  pull_request:
    paths:
      - 'research/assignment04_v1/sensitivity.py'
      - 'research/assignment04_v1/test_sensitivity.py'
      - 'research/assignment04_v1/demo_qa.py'
      - '.github/workflows/assignment04-development-sensitivity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sensitivity:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/assignment04-foundation-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: src:.
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dom.txt
      - run: python -m unittest research.assignment04_v1.test_sensitivity -v
      - name: Acquire six immutable shards only
        run: python -m phishing_url.formal_candidates --download --source-root "$RUNNER_TEMP/source" --frame config/assignment03_paired_source_frame_v1.json --policy config/assignment03_paired_release_policy_v1.json
      - run: docker build -f docker/Dockerfile.dom-data -t a04-rebuild .
      - name: Reconstruct and fit development only without network
        run: |
          mkdir -p "$RUNNER_TEMP/a04-result"
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=128 --memory=5g --cpus=2 \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m \
            -e PYTHONPATH=/repo/src:/repo -v "$GITHUB_WORKSPACE:/repo:ro" -v "$RUNNER_TEMP/source:/source:ro" \
            -v "$RUNNER_TEMP/a04-result:/output:rw" --entrypoint python a04-rebuild \
            -m research.assignment04_v1.sensitivity --root /repo --source-root /source --output /output/run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a04-development-sensitivity-${{ github.run_id }}
          path: ${{ runner.temp }}/a04-result/run/public/
          retention-days: 90
  demo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m research.assignment04_v1.demo_qa --output /tmp/demo-qa
      - uses: actions/upload-artifact@v4
        with:
          name: a04-demo-browser-${{ github.run_id }}
          path: /tmp/demo-qa/
          retention-days: 90
