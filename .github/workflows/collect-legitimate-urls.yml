name: Collect observed legitimate URLs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Retrieve and verify the frozen Tranco list
        shell: bash
        run: |
          mkdir -p data/raw
          curl --fail --location --retry 3 \
            --output data/raw/tranco-top-1m-2026-09-26.csv \
            https://tranco-list.eu/download/L5PZ4/1000000
          echo "831476d0f554af0a5164d6977acc85c95b4cc176b47366be3caa3227f5e63f90  data/raw/tranco-top-1m-2026-09-26.csv" | sha256sum --check

      - name: Run fixed connectivity diagnostic
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          python -m phishing_url.legitimate_collection \
            --tranco config/windows_connectivity_domains.csv \
            --output data/collection/cloud_diagnostic \
            --seed 20250926 --rank-min 1001 --rank-max 100000 \
            --domains 10 --per-domain-cap 3 --timeout 4 --workers 4 \
            --request-delay 0.25
          python - <<'PY'
          import csv
          from pathlib import Path
          path = Path("data/collection/cloud_diagnostic/observed_legitimate_urls.csv")
          with path.open(newline="", encoding="utf-8") as stream:
              domains = {row["candidate_domain"] for row in csv.DictReader(stream)}
          print(f"Diagnostic domains with observations: {len(domains)}/10")
          Path("data/collection/cloud_diagnostic/connectivity_gate.txt").write_text(
              "pass\n" if len(domains) >= 5 else "fail\n", encoding="utf-8"
          )
          PY

      - name: Run the preserved full collection when connectivity passes
        id: full
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          if [[ "$(cat data/collection/cloud_diagnostic/connectivity_gate.txt)" != "pass" ]]; then
            echo "Connectivity gate failed; the full collection will not run."
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -m phishing_url.legitimate_collection \
            --tranco data/raw/tranco-top-1m-2026-09-26.csv \
            --output data/collection/cloud_full_2026-09-26 \
            --seed 20250926 --rank-min 1001 --rank-max 100000 \
            --domains 1200 --per-domain-cap 3 --timeout 4 --workers 20 \
            --request-delay 0.25
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - name: Audit the full collection
        if: steps.full.outputs.ran == 'true'
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set +e
          python -m phishing_url.collection_audit \
            --observations data/collection/cloud_full_2026-09-26/observed_legitimate_urls.csv \
            --failures data/collection/cloud_full_2026-09-26/collection_failures.csv \
            --output results/assignment02/cloud_collection_audit_2026-09-26
          status=$?
          set -e
          if [[ $status -ne 0 && $status -ne 2 ]]; then exit "$status"; fi
          echo "Suitability audit exit status: $status (2 means unsuitable)."

      - name: Save diagnostic, observations, failures, configuration, and audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assignment02-cloud-collection-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            config/legitimate_collection_windows.json
            config/windows_connectivity_domains.csv
            data/collection/cloud_diagnostic/
            data/collection/cloud_full_2026-09-26/
            results/assignment02/cloud_collection_audit_2026-09-26/
