name: Four-modality offline evidence contracts
on:
  pull_request:
    paths:
      - 'research/multimodal_v1/**'
      - 'research/urlscan_v1/**'
      - 'src/phishing_url/features.py'
      - 'src/phishing_url/dom_features.py'
      - 'src/phishing_url/url_cleaning.py'
      - '.github/workflows/multimodal-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned adapters and YARA
        run: python -m pip install -r research/multimodal_v1/requirements.txt
      - name: Verify offline HTTP, missingness, forensics, integration and frozen files
        env:
          PYTHONPATH: src
          REQUIRE_YARA: '1'
        run: python -m unittest discover -s research/multimodal_v1 -p 'test_*.py' -v
