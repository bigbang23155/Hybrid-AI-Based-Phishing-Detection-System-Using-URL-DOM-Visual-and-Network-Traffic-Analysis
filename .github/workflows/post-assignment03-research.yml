name: Post Assignment 03 research intake
on:
  pull_request:
    paths:
      - 'research/robustness_v1/**'
      - '.github/workflows/post-assignment03-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: 'src:.'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dom.txt
      - name: Check inherited code and independent research guards
        run: python -m pytest -q tests research/robustness_v1/test_research.py
      - name: Replay intake without HTML, test inference or real model fitting
        run: |
          python -m research.robustness_v1.intake audit --root . --output "$RUNNER_TEMP/research-intake"
          diff -ru research/robustness_v1/evidence/intake "$RUNNER_TEMP/research-intake"
      - name: Save audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: post-assignment03-intake-${{ github.run_id }}
          retention-days: 90
          path: |
            ${{ runner.temp }}/research-intake/intake_summary.json
            ${{ runner.temp }}/research-intake/coverage.json
            ${{ runner.temp }}/research-intake/sample_size_plan.json
  snapshots:
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/post-assignment03-robustness-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: 'src:.'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dom.txt
      - name: Acquire checksum-pinned archived source shards
        run: python -m phishing_url.formal_candidates --download --source-root "$RUNNER_TEMP/research-source" --frame config/assignment03_paired_source_frame_v1.json --policy config/assignment03_paired_release_policy_v1.json
      - name: Passively reconstruct development review packets
        run: python -m research.robustness_v1.prepare_packets --root . --source-root "$RUNNER_TEMP/research-source" --queue research/robustness_v1/evidence/intake/review_queue_blinded.jsonl --output "$RUNNER_TEMP/research-packets"
      - name: Retain only sanitized technical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-assignment03-snapshot-checks-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/research-packets/public/
            ${{ runner.temp }}/research-source/acquisition.json
